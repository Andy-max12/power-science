name: Build and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup TeX Live
        uses: xu-cheng/latex-action@v2
      - name: Compile LaTeX document
        run: latexmk -pdf -silent main.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v3
        with:
          name: Наука-власти.pdf
          path: main.pdf
