name: Build PDF (no external actions)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Compile LaTeX
        run: |
          pdflatex main.tex
          pdflatex main.tex

      - name: Package PDF
        run: |
          mkdir output
          cp main.pdf output/
          tar -czf output.tar.gz output
          echo "Done"

      - name: Upload result
        run: |
          mkdir -p artifacts
          cp output.tar.gz artifacts/
        if: always()

    outputs:
      pdf: artifacts/output.tar.gz
