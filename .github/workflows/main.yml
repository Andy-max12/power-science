name: Build LaTeX PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install LaTeX
        run: |
          sudo apt update
          sudo apt install -y texlive-full

      - name: Compile PDF
        run: |
          pdflatex main.tex
          pdflatex main.tex  # дважды для оглавления

      - name: Upload PDF
        uses: actions/upload-artifact@v2
        with:
          name: main.pdf
          path: main.pdf

