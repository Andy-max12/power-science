name: Build PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Compile LaTeX
        run: |
          pdflatex main.tex
          pdflatex main.tex

      - name: Archive PDF
        run: |
          mkdir output
          mv main.pdf output/

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: main-pdf
          path: output/
