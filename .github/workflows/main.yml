name: Build PDF (no marketplace)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Compile LaTeX
        run: |
          pdflatex main.tex
          pdflatex main.tex

      - name: Archive PDF
        run: |
          mkdir -p artifacts
          mv main.pdf artifacts/
