name: Build LaTeX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Сборка main.tex через LaTeX Action
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

